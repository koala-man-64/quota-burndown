[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quota-burndown"
version = "0.2.0"
description = "Claude Code, Codex and Antigravity in one place: quota burndown per rate-limit window plus a per-request token usage ledger."
requires-python = ">=3.10"
dependencies = []
license = { text = "MIT" }

[project.scripts]
quota-burndown = "quota_burndown.cli:main"

[tool.setuptools]
packages = ["quota_burndown", "quota_burndown.providers", "quota_burndown.usage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
