name: Application tests

on:
  pull_request:
  push:
    branches: [feat/initial-build]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.application }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        application: [quota-burndown, ado-swimlane]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install test runner
        run: python -m pip install pytest==9.1.1
      - name: Verify JavaScript runtime
        run: node --version
      - name: Test parent application
        if: matrix.application == 'quota-burndown'
        run: python -m pytest -q tests
      - name: Test standalone swimlane application
        if: matrix.application == 'ado-swimlane'
        working-directory: ado-swimlane
        run: python -m pytest -q
